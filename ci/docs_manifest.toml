# docs_manifest.toml — the list of Markdown files whose fenced code blocks
# must be executed by the CI harness (ci/verify-docs.sh → ci/block_runner.py).
#
# Every new doc added to the list must ALSO pass block-level review:
# any block that can't be executed verbatim in a clean container must carry
# a trailing `<!-- verify: skip reason="..." -->` comment with a real reason.
#
# Start small — grow as we gain confidence.

files = [
    # Public entry docs only. Long walkthroughs and agent/mascot manuals
    # intentionally stay out of the executable harness until they have
    # hermetic fixtures; many require GUI apps, external CLIs, local LLMs,
    # Chrome/CDP, Tytus, or user-specific plugin state. Their examples must
    # carry explicit verify-skip markers when listed here.
    "docs/getting-started.md",
    "docs/quickstart.md",
    "docs/walkthroughs/dsh-agent-runtime.md",
]
