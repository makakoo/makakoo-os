# ollama-local — legacy Flue compatibility example
#
# The default DSH runtime is switchAILocal-only and rejects this model.
# Use this file only with the explicit, manually operated compatibility path:
#   MAKAKOO_AGENT_ENGINE=flue makakoo agent create --specs ./ollama-local.yaml
# Then follow the generated Flue README; the Makakoo supervisor does not run it.
# Requires Ollama running locally (http://localhost:11434).
#
# Quick setup:
#   brew install ollama  (or download from https://ollama.com)
#   ollama serve &
#   ollama pull qwen3:8b
#
# Verify Ollama is reachable:
#   curl http://localhost:11434/api/tags
#
# See docs/agents/spec.md for the full schema and the provider
# resolution flow.

name: ollama-local
description: "Local Ollama agent (no external LLM API key)"

# The model specifier is `ollama/<model-name>`. The model name
# is auto-detected from `GET /api/tags` (first model wins) and
# the spec is updated on `makakoo agent create` if needed.
model: ollama/nemotron-3-super:cloud

instructions: |
  You are a local-first agent. All inference runs on the host via
  Ollama — no external API calls, no telemetry leaves the machine.
  Answer concisely and use the available Makakoo tools when needed.

tools: [brain_search, write_file]

triggers: []

scope:
  allowed_paths: ["~/MAKAKOO/data/ollama-local/**"]
  forbidden_paths: ["~/.ssh/**", "~/.aws/**"]

# Channel generation belongs to the legacy Flue compatibility renderer.
# The `switchailocal` provider and `ollama` provider are mutually
# exclusive: this spec uses ollama. The Flue scaffolder picks the
# provider based on the spec's `model` field prefix.
channels:
  - kind: telegram
    token_env: TELEGRAM_BOT_TOKEN
    # Get your user ID from @userinfobot on Telegram.
    allowed_users: ["746496145"]
