# scheduled-reporter — autonomous daemon, no channels
#
# Zero channels. Zero outbound UI. The agent only runs on cron ticks
# and writes reports to the filesystem (within its scope).
#
# Use case: a background agent that generates periodic reports and
# saves them to disk. No human interaction.
#
# Try it:
#   makakoo agent validate-spec ./scheduled-reporter.yaml
#   makakoo agent create --specs ./scheduled-reporter.yaml
#   cd $MAKAKOO_HOME/agents-dsh/scheduled-reporter
#   npm install
#   makakoo agent start scheduled-reporter
#   makakoo agent prompt scheduled-reporter "Generate this week's report"
#
# The supervisor schedules the cron trigger below: `agent start` is all that
# is needed. No external scheduler, no crontab entry.
#
# See docs/agents/spec.md for the full schema.

name: scheduled-reporter
description: "Weekly autonomous report generator (no channels)"

model: switchailocal/ail-compound

instructions: |
  You are an autonomous reporting agent. Every Monday at 09:00 UTC, you
  wake up and write a weekly report summarizing the past 7 days of
  activity. Pull data from the Brain (use brain_search), write a
  concise Markdown report to ~/MAKAKOO/data/reports/weekly-YYYY-MM-DD.md
  (use write_file), and log a one-line summary in the audit log.

  You do NOT respond to chat — there are no channels. The cron tick
  is your only trigger.

tools:
  - brain_search
  - write_file

# No channels: this agent is headless. The scheduled answer is logged and the
# real output is the report written to disk.

triggers:
  - kind: cron
    schedule: "0 9 * * 1"     # 09:00 every Monday (dow 1 = Monday, as crontab)
    timezone: "UTC"
    prompt: "Write this week's report covering the last 7 days."

scope:
  allowed_paths:
    - "~/MAKAKOO/data/reports/**"
  forbidden_paths:
    - "~/.ssh/**"
    - "~/.aws/**"
    - "~/.gnupg/**"
