# weather-bot — monitor weather, alert on severe conditions
#
# Channels/triggers: declarations preserved, not executed by DSH V1
# Tools: brain_search, web_search, write_file
# Scope: ~/MAKAKOO/data/weather/** (read/write allowed)
#
# Try it:
#   makakoo agent validate-spec ./weather-bot.yaml
#   makakoo agent create --specs ./weather-bot.yaml
#   cd $MAKAKOO_HOME/agents-dsh/weather-bot
#   npm install
#   makakoo agent start weather-bot
#   makakoo agent prompt weather-bot "Check the current forecast"
# Add the Makakoo/Flue channel-adapter slice before expecting Telegram or cron.
#
# See docs/agents/spec.md for the full schema.

name: weather-bot
description: "Monitor weather forecasts, alert on severe conditions"

model: switchailocal/ail-compound

instructions: |
  You are a weather monitoring agent. Every 6 hours, check the forecast
  for the operator's region (look it up in the Brain under
  `weather/region`). If severe conditions are expected (high winds,
  flooding, extreme heat/cold), post an alert to the operator's
  Telegram channel with a short summary and a link to the source.

  When the operator messages you on Telegram, answer weather questions
  concisely and use the available Makakoo tools (brain_search,
  web_search, write_file) to gather data.

tools:
  - brain_search
  - web_search
  - write_file

channels:
  - kind: telegram
    token_env: TELEGRAM_BOT_TOKEN
    allowed_users:
      - "746496145"   # operator's Telegram user ID

triggers:
  - kind: cron
    schedule: "0 */6 * * *"
    timezone: "UTC"

scope:
  allowed_paths:
    - "~/MAKAKOO/data/weather/**"
  forbidden_paths:
    - "~/.ssh/**"
    - "~/.aws/**"
    - "~/.gnupg/**"
