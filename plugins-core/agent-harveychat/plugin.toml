[plugin]
name = "agent-harveychat"
version = "1.0.1"
kind = "agent"
language = "python"
summary = "Harvey's external messaging gateway — Telegram, (future) WhatsApp, Slack"
authors = ["Makakoo OS contributors"]
license = "MIT"

[source]
path = "plugins-core/agent-harveychat"

[abi]
agent = "^1.0"

[depends]
plugins = ["lib-harvey-core *", "lib-hte *"]
python = ">=3.9"

[install]
unix = "install.sh"

[entrypoint]
start = ".venv/bin/python -u src/agent.py start --daemon"
stop = ".venv/bin/python -u src/agent.py stop"
health = ".venv/bin/python -u src/agent.py status"

[capabilities]
grants = ["llm/chat"]

[state]
dir = "$MAKAKOO_HOME/state/agent-harveychat"
retention = "keep"
