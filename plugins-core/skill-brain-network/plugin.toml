[plugin]
name = "skill-brain-network"
version = "0.1.0"
kind = "skill"
language = "python"
summary = "Opt-in Brain Network control plane: activate/deactivate Octopus peer federation, register peer endpoints, and run origin-tagged remote Brain reads."
authors = ["Makakoo OS contributors"]
license = "MIT"

[source]
path = "plugins-core/skill-brain-network"

[abi]
skill = "^1.0"

[depends]
python = ">=3.9"
plugins = ["lib-harvey-core", "agent-octopus-peer"]

[entrypoint]
run = "python3 -u src/brain_network.py"

[capabilities]
grants = [
    "exec/binary:makakoo",
    "net/http:127.0.0.1:8765",
    "net/http:0.0.0.0:8765",
    "brain/read",
    "state/plugin",
]

[state]
dir = "$MAKAKOO_HOME/state/skill-brain-network"
retention = "keep"
