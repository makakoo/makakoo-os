[plugin]
name = "skill-system-persona-capture"
version = "0.1.0"
kind = "skill"
language = "python"
summary = "Persist user, assistant, companion, and channel persona names into Makakoo OS identity registry."
authors = ["Makakoo OS contributors"]
license = "MIT"

[source]
path = "plugins-core/skill-system-persona-capture"

[abi]
skill = "^1.0"

[depends]
python = ">=3.8"

[entrypoint]
run = "python3 -u src/persona_capture.py"

[capabilities]
grants = []

[state]
dir = "$MAKAKOO_HOME/state/skill-system-persona-capture"
retention = "keep"
