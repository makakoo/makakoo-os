# Repo-wide pytest configuration.
#
# `pythonpath` lets the Python suites import the in-tree packages — notably
# `core.*` from lib-harvey-core and the client SDK — without every developer
# or CI step exporting PYTHONPATH by hand. For example, from the repo root:
#
#   python3 -m pytest plugins-core/lib-harvey-core/src/core/agent
#
# resolves `from core.agent.harvey_agent import ...` against the path below.
[pytest]
pythonpath =
    plugins-core/lib-harvey-core/src
    makakoo-client-py/src
